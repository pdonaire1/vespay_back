name: pre-commit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ env.pythonLocation }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed_files=$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA"...HEAD)
          if [ -z "$changed_files" ]; then
            echo "No files changed. Nothing to check."
            exit 0
          fi
          echo "Files to check:"
          echo "$changed_files"
          # shellcheck disable=SC2086
          pre-commit run --show-diff-on-failure --color=always --files $changed_files
