services:
  postgres:
    image: postgres:16-alpine
    container_name: vespay_postgres
    environment:
      POSTGRES_DB: vespay
      POSTGRES_USER: vespay
      POSTGRES_PASSWORD: vespay
    ports:
      - "5432:5432"
    volumes:
      - vespay_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vespay"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vespay_redis
    ports:
      - "6379:6379"
    volumes:
      - vespay_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vespay_postgres_data:
  vespay_redis_data:
