<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>{% block subject %}VesPay{% endblock %}</title>
  <style type="text/css">
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table { border-collapse: collapse !important; }
    body { margin: 0; padding: 0; width: 100%; }
    @media only screen and (max-width: 640px) {
      .container { width: 100% !important; }
      .content { padding: 24px 16px !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; background-color:#F8F9FF; font-family:'Inter', Helvetica, Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F8F9FF; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" style="width:600px; max-width:600px; background-color:#FFFFFF; border-radius:16px; overflow:hidden;">
          <tr>
            <td style="padding:32px 24px; text-align:center; border-bottom:1px solid #E2E6F2;">
              {% if logo_cid %}
                <img src="cid:{{ logo_cid }}" alt="VesPay" width="180" style="display:block; margin:0 auto; border:0; width:180px; max-width:180px; height:auto;">
              {% else %}
                <span style="font-size:26px; font-weight:800; color:#0034C5; letter-spacing:-0.5px;">VesPay</span>
              {% endif %}
              <div style="font-size:12px; color:#434657; margin-top:4px;">Tus pagos, un solo lugar</div>
            </td>
          </tr>
          <tr>
            <td class="content" style="padding:32px 40px; color:#0B1C30; font-size:15px; line-height:1.6;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 40px; border-top:1px solid #E2E6F2; text-align:center;">
              <span style="font-size:12px; color:#434657; line-height:1.5;">
                © 2026 VesPay<br>
                Si no solicitaste este correo, puedes ignorarlo con seguridad.
              </span>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
